<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>안서동 안심귀가 QR</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #edf4ff;
      color: #17233a;
    }

    .container {
      width: min(92%, 460px);
      margin: 24px auto;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 24px rgba(36, 74, 140, .12);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .subtitle {
      margin: 0 0 18px;
      color: #61708a;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: bold;
    }

    input,
    button {
      width: 100%;
      min-height: 48px;
      border-radius: 10px;
      font-size: 16px;
    }

    input {
      border: 1px solid #ccd6e8;
      padding: 10px 12px;
      background: white;
    }

    button {
      border: 0;
      margin-top: 16px;
      color: white;
      background: #2764cf;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .7;
      cursor: wait;
    }

    button.danger {
      background: #dc3545;
    }

    .status {
      margin-top: 16px;
      padding: 13px;
      border-radius: 10px;
      background: #eef7ef;
      color: #24642b;
      line-height: 1.6;
      white-space: pre-line;
    }

    #map {
      height: 360px;
      margin-top: 16px;
      border-radius: 12px;
      border: 1px solid #ccd6e8;
      z-index: 1;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>안서동 대학가 안심귀가</h1>
      <p class="subtitle">
        출발지와 목적지를 입력하면 앱을 설치하지 않고도
        페이지 안에서 지도를 확인할 수 있습니다.
      </p>

      <label for="startLocation">출발지</label>
      <input
        id="startLocation"
        type="text"
        placeholder="예: 백석대학교 정문"
        value="백석대학교"
      >

      <label for="destination">목적지</label>
      <input
        id="destination"
        type="text"
        placeholder="예: 천안역"
      >

      <label for="phone">긴급 연락처</label>
      <input
        id="phone"
        type="tel"
        inputmode="tel"
        placeholder="예: 010-1234-5678"
      >

      <button id="startButton" type="button">안심귀가 시작</button>

      <button id="mapButton" type="button" class="hidden">
        지도에서 도보 경로 보기
      </button>

      <button id="emergencyButton" type="button" class="danger hidden">
        긴급 신고 112 연결
      </button>

      <div id="status" class="status hidden"></div>
      <div id="map" class="hidden"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const startLocationInput = document.getElementById("startLocation");
    const destinationInput = document.getElementById("destination");
    const phoneInput = document.getElementById("phone");
    const startButton = document.getElementById("startButton");
    const mapButton = document.getElementById("mapButton");
    const emergencyButton = document.getElementById("emergencyButton");
    const status = document.getElementById("status");
    const mapElement = document.getElementById("map");

    let map;
    let routeLayer;

    startButton.addEventListener("click", () => {
      const startLocation = startLocationInput.value.trim();
      const destination = destinationInput.value.trim();
      const phone = phoneInput.value.trim();

      if (!startLocation) {
        alert("출발지를 입력해주세요.");
        startLocationInput.focus();
        return;
      }

      if (!destination) {
        alert("목적지를 입력해주세요.");
        destinationInput.focus();
        return;
      }

      if (!phone) {
        alert("긴급 연락처를 입력해주세요.");
        phoneInput.focus();
        return;
      }

      status.classList.remove("hidden");
      status.textContent =
        "안심귀가가 시작되었습니다.\n" +
        "출발지: " + startLocation + "\n" +
        "목적지: " + destination + "\n" +
        "긴급 연락처: " + phone;

      mapButton.classList.remove("hidden");
      emergencyButton.classList.remove("hidden");

      localStorage.setItem("safeReturnInfo", JSON.stringify({
        from: startLocation,
        to: destination,
        phone: phone
      }));
    });

    mapButton.addEventListener("click", async () => {
      const start = startLocationInput.value.trim();
      const destination = destinationInput.value.trim();

      if (!start || !destination) {
        alert("출발지와 목적지를 모두 입력해주세요.");
        return;
      }

      mapButton.disabled = true;
      mapButton.textContent = "도보 경로를 찾는 중...";

      try {
        async function findPlace(place) {
          const query = encodeURIComponent(
            place + ", 천안시, 충청남도, 대한민국"
          );

          const response = await fetch(
            "https://nominatim.openstreetmap.org/search" +
            "?format=jsonv2&limit=1&q=" + query,
            {
              headers: {
                "Accept-Language": "ko"
              }
            }
          );

          if (!response.ok) {
            throw new Error("장소 검색 서버에 연결할 수 없습니다.");
          }

          const results = await response.json();

          if (!results.length) {
            throw new Error("위치를 찾을 수 없습니다: " + place);
          }

          return {
            lat: Number(results[0].lat),
            lon: Number(results[0].lon)
          };
        }

        const from = await findPlace(start);
        const to = await findPlace(destination);

        const routeResponse = await fetch(
          "https://router.project-osrm.org/route/v1/foot/" +
          from.lon + "," + from.lat + ";" +
          to.lon + "," + to.lat +
          "?overview=full&geometries=geojson"
        );

        if (!routeResponse.ok) {
          throw new Error("도보 경로 서버에 연결할 수 없습니다.");
        }

        const routeData = await routeResponse.json();

        if (!routeData.routes || !routeData.routes.length) {
          throw new Error("도보 경로를 찾지 못했습니다.");
        }

        mapElement.classList.remove("hidden");

        if (!map) {
          map = L.map("map").setView([36.839, 127.1817], 14);

          L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
              maxZoom: 19,
              attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }
          ).addTo(map);
        }

        if (routeLayer) {
          map.removeLayer(routeLayer);
        }

        const route = routeData.routes[0];
        const points = route.geometry.coordinates.map(
          ([lon, lat]) => [lat, lon]
        );

        routeLayer = L.featureGroup([
          L.marker([from.lat, from.lon])
            .bindPopup("출발: " + start),

          L.marker([to.lat, to.lon])
            .bindPopup("도착: " + destination),

          L.polyline(points, {
            color: "#2764cf",
            weight: 5
          })
        ]).addTo(map);

        map.fitBounds(routeLayer.getBounds(), {
          padding: [24, 24]
        });

        map.invalidateSize();
      } catch (error) {
        alert(
          error.message ||
          "지도를 불러오지 못했습니다. 잠시 후 다시 시도해주세요."
        );
      } finally {
        mapButton.disabled = false;
        mapButton.textContent = "지도에서 도보 경로 보기";
      }
    });

    emergencyButton.addEventListener("click", () => {
      window.location.href = "tel:112";
    });

    const saved = JSON.parse(
      localStorage.getItem("safeReturnInfo") || "null"
    );

    if (saved) {
      startLocationInput.value = saved.from || "백석대학교";
      destinationInput.value = saved.to || "";
      phoneInput.value = saved.phone || "";
    }
  </script>
</body>
</html>
